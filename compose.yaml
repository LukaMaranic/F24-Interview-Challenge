name: f24-interview-challenge

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    restart: unless-stopped

  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-f24}
      DB_USERNAME: ${DB_USERNAME:-f24}
      DB_PASSWORD: ${DB_PASSWORD:-local-development-password}
    volumes:
      - ./backend:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:1.29-alpine
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./backend:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - app
    restart: unless-stopped

  db:
    image: mariadb:11.8
    environment:
      MARIADB_DATABASE: ${DB_DATABASE:-f24}
      MARIADB_USER: ${DB_USERNAME:-f24}
      MARIADB_PASSWORD: ${DB_PASSWORD:-local-development-password}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-local-root-password}
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

volumes:
  frontend_node_modules:
  mariadb_data:
